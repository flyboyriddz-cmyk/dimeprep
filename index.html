    <style>
      :root {
        --snes-bg: #e0e0dc;
        --snes-light: #f0f0f4;
        --snes-dark: #2c2c36;
        --snes-white: #ffffff;
        --snes-inverse: #e0e0dc;
        --snes-purple: #5c4fb3;
        --snes-purple-light: #8e84d4;
        --snes-red: #d32f2f;
        --snes-green: #008f40;
        --snes-yellow: #fbc02d;
        --snes-blue: #004ba0;
        --snes-gray-dark: #555555;
        --snes-orange: #ff6b00;
        --retro-term: #33ff00;
      }

      .dark {
        --snes-bg: #1a1a24;
        --snes-light: #25252d;
        --snes-dark: #e0e0dc;
        --snes-white: #2c2c36;
        --snes-inverse: #2c2c36;
        --snes-purple: #8e84d4;
        --snes-purple-light: #5c4fb3;
        --snes-gray-dark: #a0a0a0;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        /* Prevent pinch zoom and elastic scrolling */
        touch-action: pan-x pan-y;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: none;
      }

      body {
        background-color: var(--snes-bg);
        font-family: 'VT323', monospace;
        /* Disable text selection global */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        /* Mobile Touch Callouts Disable */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        /* Prevent font boosting on mobile */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      
      /* Global Override for Form Elements to ensure Retro Font */
      input, button, select, textarea {
        font-family: 'VT323', monospace;
      }

      /* Re-enable text selection for input fields */
      input, textarea, select {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }

      /* Disable image dragging */
      img {
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        user-drag: none;
        pointer-events: none; /* Prevents long-press save image on mobile */
      }

      /* PRINT PROTECTION: Hide content if user tries to print/pdf */
      @media print {
        html, body {
          display: none !important;
          height: 0 !important;
          overflow: hidden !important;
        }
      }
      
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: var(--snes-light);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--snes-purple);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--snes-purple-light);
      }

      /* Animations */
      @keyframes blink {
        50% { opacity: 0; }
      }
      
      @keyframes vhs-flicker {
        0% { opacity: 0.95; }
        5% { opacity: 0.8; }
        10% { opacity: 0.95; }
        15% { opacity: 0.6; }
        20% { opacity: 0.95; }
        100% { opacity: 0.95; }
      }

      @keyframes glitch-snap {
        2%, 64% { transform: translate(2px,0) skew(0deg); }
        4%, 60% { transform: translate(-2px,0) skew(0deg); }
        62% { transform: translate(0,0) skew(5deg); }
      }

      @keyframes loading-bar {
        0% { width: 0%; }
        100% { width: 100%; }
      }

      @keyframes grid-scroll {
        0% { background-position: 0 0; }
        100% { background-position: 40px 40px; }
      }
      
      @keyframes text-shine {
        from { background-position: 0% center; }
        to { background-position: 200% center; }
      }

      .text-shadow-md {
        text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
      }
      
      .holo-gradient {
        background: linear-gradient(135deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 70%);
        background-size: 200% 200%;
      }
      
      .image-pixelated {
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .animate-blink { animation: blink 1s step-end infinite; }
      .animate-vhs { animation: vhs-flicker 0.1s infinite; }
      .animate-glitch-text { animation: glitch-snap 3s infinite; }
      .animate-load-progress { animation: loading-bar 1s ease-out forwards; }
      .animate-grid-move { animation: grid-scroll 2s linear infinite; }
      .animate-float { animation: float 3s ease-in-out infinite; }
      .animate-holo { animation: holo-shimmer 2s linear infinite; }
      .animate-text-shine { animation: text-shine 3s linear infinite; }

      .fade-in {
        animation: fadeIn 0.5s ease-in;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
